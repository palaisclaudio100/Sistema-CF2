services:
  - type: web
    name: cf2-prod-core
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CF2_DATABASE_URL
        fromDatabase:
          name: cf2-prod-postgres
          property: connectionString
      - key: CF2_RELEASE_ID
        sync: false
      - key: CF2_PRODUCTION_WRITER_ENABLED
        value: "false"
      - key: CF2_EXTERNAL_ADAPTERS_ENABLED
        value: "false"
      - key: CF2_ROLE_CUTOVER_ENABLED
        value: "false"
      - key: CF2_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: CF2_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: CF2_GOOGLE_ROLE_BINDINGS
        sync: false
      - key: CF2_OIDC_REPOSITORY
        value: palaisclaudio100/Sistema-CF2
      - key: CF2_OIDC_REPOSITORY_ID
        value: "1351688098"
      - key: CF2_OIDC_WORKFLOW_REF
        value: palaisclaudio100/Sistema-CF2/.github/workflows/cf2-minimum-cutover.yml@refs/heads/master
      - key: CF2_OIDC_REF
        value: refs/heads/master
databases:
  - name: cf2-prod-postgres
    plan: basic-256mb
    databaseName: cf2prod
    user: cf2prod

name: CF2 real handoff production deploy

on:
  push:
    branches:
      - cf2-orchestration-cutover

permissions:
  contents: read

jobs:
  deploy-real-handoff:
    if: contains(github.event.head_commit.message, 'publish real handoff')
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: srv-daa8dngae00c73a3m15g
      TARGET_COMMIT: ${{ github.sha }}
      CORE_URL: https://cf2-prod-core.onrender.com
    steps:
      - name: Verify exact service and deploy exact commit once
        shell: python
        run: |
          import json, os, time, urllib.request
          token=os.environ['RENDER_API_KEY']
          if not token: raise SystemExit('RENDER_API_KEY_MISSING')
          api='https://api.render.com/v1'; service_id=os.environ['SERVICE_ID']; commit=os.environ['TARGET_COMMIT']
          def call(method,path,payload=None):
            request=urllib.request.Request(api+path,data=None if payload is None else json.dumps(payload).encode(),method=method,headers={'Authorization':f'Bearer {token}','Accept':'application/json','Content-Type':'application/json'})
            with urllib.request.urlopen(request,timeout=60) as response:
              body=response.read(); return json.loads(body) if body else None
          wrapped=call('GET',f'/services/{service_id}'); service=wrapped.get('service',wrapped)
          if service.get('id')!=service_id: raise SystemExit('SERVICE_ID_MISMATCH')
          if service.get('name')!='cf2-prod-core': raise SystemExit('SERVICE_NAME_MISMATCH')
          if service.get('type') not in ('web_service','web'): raise SystemExit('SERVICE_TYPE_MISMATCH')
          if service.get('branch')!='master' or 'palaisclaudio100/Sistema-CF2' not in service.get('repo',''): raise SystemExit('SERVICE_SOURCE_MISMATCH')
          if service.get('autoDeploy') not in ('no',False): raise SystemExit('AUTODEPLOY_NOT_OFF')
          env_rows=call('GET',f'/services/{service_id}/env-vars'); env_rows=[row.get('envVar',row) for row in env_rows]
          env_before={row.get('key'):row.get('value') for row in env_rows}
          call('PUT',f'/services/{service_id}/env-vars/CF2_RELEASE_ID',{'value':commit})
          configured=call('GET',f'/services/{service_id}/env-vars/CF2_RELEASE_ID'); configured=configured.get('envVar',configured)
          if configured.get('key')!='CF2_RELEASE_ID' or configured.get('value')!=commit: raise SystemExit('RELEASE_CONFIG_MISMATCH')
          env_rows_after=call('GET',f'/services/{service_id}/env-vars'); env_rows_after=[row.get('envVar',row) for row in env_rows_after]
          env_after={row.get('key'):row.get('value') for row in env_rows_after}
          if set(env_before)!=set(env_after): raise SystemExit('OTHER_ENV_KEYS_CHANGED')
          if any(key!='CF2_RELEASE_ID' and env_before.get(key)!=env_after.get(key) for key in env_before): raise SystemExit('OTHER_ENV_CHANGED')
          created=call('POST',f'/services/{service_id}/deploys',{'commitId':commit}); deploy=created.get('deploy',created); deploy_id=deploy.get('id')
          if not deploy_id: raise SystemExit('DEPLOY_ID_MISSING')
          deadline=time.monotonic()+1200
          while time.monotonic()<deadline:
            state=call('GET',f'/services/{service_id}/deploys/{deploy_id}'); state=state.get('deploy',state)
            if state.get('status') in ('live','build_failed','update_failed','canceled'): break
            time.sleep(10)
          if state.get('status')!='live' or state.get('commit',{}).get('id')!=commit: raise SystemExit(f"DEPLOY_FAILED:{state.get('status')}")
          print(json.dumps({'deploy_id':deploy_id,'commit':commit,'service_id':service_id}))

      - name: Verify deployed health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            health="$(curl --fail --silent --show-error "$CORE_URL/health" || true)"
            if HEALTH="$health" TARGET_COMMIT="$TARGET_COMMIT" python3 - <<'PY'
          import json,os
          h=json.loads(os.environ['HEALTH'])
          assert h['release_id']==os.environ['TARGET_COMMIT']
          assert h['database']=='UP'
          assert h['outbox_pending']==0
          assert h['flags']['external_adapters_enabled'] is False
          PY
            then exit 0; fi
            sleep 5
          done
          exit 1

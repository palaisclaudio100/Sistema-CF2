name: CF2 Stage5 cloud gate infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-staging-service:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GATE_COMMIT: ${{ github.sha }}
    steps:
      - name: Update exact isolated Free staging service
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          API='https://api.render.com/v1'; token=os.environ.get('RENDER_API_KEY')
          STAGING_ID='srv-daaqc2u7bikc73fkg44g'
          PROD_CORE_ID='srv-daa8dngae00c73a3m15g'
          def call(method,path,payload=None):
            req=urllib.request.Request(API+path,data=None if payload is None else json.dumps(payload).encode(),method=method,headers={'Accept':'application/json','Content-Type':'application/json','Authorization':f'Bearer {token}'})
            with urllib.request.urlopen(req,timeout=45) as r: return json.load(r)
          if not token: raise SystemExit('SECRET_MISSING')
          if STAGING_ID==PROD_CORE_ID: raise SystemExit('PRODUCTION_ISOLATION_UNPROVEN')
          service=call('GET',f'/services/{STAGING_ID}')
          service=service.get('service',service)
          details=service.get('serviceDetails',{})
          if service.get('id')!=STAGING_ID: raise SystemExit('STAGING_SERVICE_ID_MISMATCH')
          if service.get('name')!='cf2-stage5-role-gate': raise SystemExit('STAGING_SERVICE_NAME_MISMATCH')
          if details.get('plan',service.get('plan'))!='free': raise SystemExit('FREE_PLAN_UNAVAILABLE')
          if service.get('autoDeploy')!='no': raise SystemExit('STAGING_AUTODEPLOY_NOT_OFF')
          env_rows=call('GET',f'/services/{STAGING_ID}/env-vars')
          env_keys={row.get('envVar',row).get('key') for row in env_rows}
          if {'DATABASE_URL','CF2_DATABASE_URL'} & env_keys: raise SystemExit('PRODUCTION_DATABASE_BINDING_PRESENT')
          deploys=call('GET',f"/services/{service['id']}/deploys?limit=1")
          current=(deploys[0].get('deploy',deploys[0]) if deploys else {})
          current_commit=(current.get('commit') or {}).get('id')
          if current_commit!=os.environ['GATE_COMMIT']:
            call('POST',f"/services/{STAGING_ID}/deploy",{'commitId':os.environ['GATE_COMMIT']})
          print('STAGE5_SERVICE_ID='+service['id'])
          print('STAGE5_SERVICE_URL='+details.get('url',service.get('url','')))
          print('STAGE5_PLAN=free')
          PY
